# Scrape interval is 1s rather than the usual 15s because a benchmark
# window is only 20 seconds long. At 15s a run would produce one or two
# samples, which is not enough to see a batching transient.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: triton
    static_configs:
      - targets: ["triton:8002"]
